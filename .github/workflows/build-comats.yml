name: Build COMATS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "COMATS version"
        required: true
        default: "2.0.1"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build COMATS with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm .\main.spec

      - name: Verify PyInstaller build
        shell: pwsh
        run: |
          if (-not (Test-Path ".\dist\main\main.exe")) {
              throw "PyInstaller did not create dist\main\main.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build COMATS installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              throw "Inno Setup compiler was not found."
          }

          & $iscc `
            "/DAppVersion=${{ inputs.version }}" `
            ".\comats.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = ".\installer-output\COMATS-${{ inputs.version }}-Setup.exe"

          if (-not (Test-Path $installer)) {
              throw "Inno Setup did not create $installer"
          }

          Get-FileHash $installer -Algorithm SHA256 |
              Format-List

      - name: Upload COMATS installer
        uses: actions/upload-artifact@v4
        with:
          name: COMATS-${{ inputs.version }}-Installer
          path: installer-output/COMATS-${{ inputs.version }}-Setup.exe
          if-no-files-found: error
          retention-days: 30
